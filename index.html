<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Dark Shadow</title>

    <!-- Install on iPhone: Safari > Share > Add to Home Screen -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dark Shadow" />
    <meta name="theme-color" content="#05020a" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0; height: 100%; background: #05020a; overflow: hidden;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { width: 100vw; height: 100vh; height: 100dvh; }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #05020a; color: #fff; font-family: Bangers, Impact, sans-serif;
        font-size: 34px; letter-spacing: 1px; text-align: center;
        align-items: center; justify-content: center; flex-direction: column; gap: 18px;
      }
      #rotate .phone { width: 60px; height: 100px; border: 5px solid #b48cff; border-radius: 12px; animation: turn 1.8s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
      .ds-input {
        position: fixed; left: 50%; top: 56%; transform: translate(-50%, -50%); z-index: 5;
        width: 260px; padding: 10px 14px; border-radius: 12px; border: 4px solid #b48cff;
        background: #140a24; color: #fff; text-align: center; text-transform: uppercase;
        font-family: Bangers, Impact, sans-serif; font-size: 48px; letter-spacing: 10px; outline: none;
        -webkit-user-select: text; user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div>Turn your phone sideways</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
